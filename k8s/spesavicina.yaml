apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spesavicina-ocr-cache
  namespace: grocery-offers
  labels: { app.kubernetes.io/name: ocr-worker, app.kubernetes.io/part-of: spesavicina }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-worker
  namespace: grocery-offers
  labels: { app.kubernetes.io/name: ocr-worker, app.kubernetes.io/part-of: spesavicina }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: ocr-worker } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ocr-worker, app.kubernetes.io/part-of: spesavicina }
      annotations: { spesavicina.dev/revision: "20261017-ocr-1" }
    spec:
      nodeSelector: { kubernetes.io/hostname: sh }
      containers:
        - name: ocr
          image: node:22-bookworm-slim
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - >-
              apt-get update &&
              apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-ita tesseract-ocr-eng util-linux &&
              rm -rf /var/lib/apt/lists/* &&
              gzip -dc /bundle/ocr.mjs.gz > /work/ocr.mjs &&
              chown -R 1000:1000 /work /tmp/ocr /data &&
              exec setpriv --reuid=1000 --regid=1000 --clear-groups node /work/ocr.mjs
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: spesavicina-config } }]
          env:
            - name: SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: spesavicina-service-secrets, key: SERVICE_TOKEN } }
            - { name: OCR_CACHE_DIR, value: /data }
            - { name: OCR_WORK_DIR, value: /tmp/ocr }
            - { name: OCR_LANGUAGES, value: ita }
            - { name: OCR_DPI, value: "120" }
            - { name: OCR_MAX_PAGES, value: "48" }
            - { name: OCR_PAGE_CONCURRENCY, value: "2" }
          volumeMounts:
            - { name: bundle, mountPath: /bundle, readOnly: true }
            - { name: runtime, mountPath: /work }
            - { name: scratch, mountPath: /tmp/ocr }
            - { name: cache, mountPath: /data }
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10, failureThreshold: 30, timeoutSeconds: 3 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 30, timeoutSeconds: 3 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL], add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID] }
      volumes:
        - { name: bundle, configMap: { name: spesavicina-ocr-bundle } }
        - { name: runtime, emptyDir: {} }
        - { name: scratch, emptyDir: { sizeLimit: 1Gi } }
        - { name: cache, persistentVolumeClaim: { claimName: spesavicina-ocr-cache } }
---
