apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spesavicina
  namespace: grocery-offers
spec:
  ingressClassName: tailscale
  rules:
    - host: spesavicina
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: spesavicina, port: { number: 80 } } }
  tls:
    - hosts: [spesavicina]
