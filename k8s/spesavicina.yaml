apiVersion: v1
kind: Namespace
metadata:
  name: grocery-offers
  labels:
    app.kubernetes.io/part-of: spesavicina
---
apiVersion: acid.zalan.do/v1
kind: postgresql
metadata:
  name: spesavicina-postgres
  namespace: grocery-offers
  labels:
    app.kubernetes.io/name: spesavicina-postgres
    app.kubernetes.io/part-of: spesavicina
spec:
  teamId: spesavicina
  numberOfInstances: 1
  enableConnectionPooler: false
  enableLogicalBackup: false
  enableMasterLoadBalancer: false
  enableReplicaLoadBalancer: false
  users:
    spesavicina_app:
      - login
  databases:
    spesavicina: spesavicina_app
  postgresql:
    version: "16"
    parameters:
      max_connections: "60"
      shared_buffers: 128MB
      effective_cache_size: 384MB
      log_min_duration_statement: "1000"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 750m, memory: 768Mi }
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [sh]
  volume:
    size: 5Gi
    storageClass: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spesavicina-config
  namespace: grocery-offers
data:
  BASE_URL: https://spesavicina.example.com
  GOOGLE_REDIRECT_URI: https://spesavicina.example.com/api/auth/google/callback
  PUBLIC_DIR: /app/public
  PORT: "8080"
  PGHOST: spesavicina-postgres
