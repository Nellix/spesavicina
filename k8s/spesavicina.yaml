apiVersion: batch/v1
kind: CronJob
metadata: { name: carrefour-ingestion, namespace: grocery-offers }
spec:
  schedule: "17 5,17 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: trigger
              image: node:22-bookworm-slim
              command: ["node", "-e", "fetch(process.env.TARGET,{method:'POST',headers:{authorization:'Bearer '+process.env.SERVICE_TOKEN}}).then(async r=>{if(!r.ok)throw Error(await r.text());console.log(await r.text())})"]
              env:
                - { name: TARGET, value: "http://carrefour-ingestor/run" }
                - name: SERVICE_TOKEN
                  valueFrom: { secretKeyRef: { name: spesavicina-service-secrets, key: SERVICE_TOKEN } }
              resources: { requests: { cpu: 5m, memory: 32Mi }, limits: { cpu: 100m, memory: 96Mi } }
