apiVersion: apps/v1
kind: Deployment
metadata:
  name: spesavicina
  namespace: grocery-offers
  labels:
    app.kubernetes.io/name: spesavicina
    app.kubernetes.io/component: web-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: spesavicina
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spesavicina
        app.kubernetes.io/component: web-api
      annotations:
        spesavicina.dev/revision: "20260921-retail-radius-2"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: node:22-bookworm-slim
          imagePullPolicy: IfNotPresent
          command: ["node", "/app/api.mjs"]
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: spesavicina-config }
            - secretRef: { name: spesavicina-service-secrets }
          env:
            - name: SERVICE_NAME
              value: web-api
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: spesavicina-app.spesavicina-postgres.credentials.postgresql.acid.zalan.do
                  key: password
          volumeMounts:
            - { name: bundle, mountPath: /app/api.mjs, subPath: api.mjs, readOnly: true }
            - { name: public, mountPath: /app/public, readOnly: true }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: bundle
          configMap: { name: spesavicina-api-bundle }
        - name: public
          configMap: { name: spesavicina-public }
---
apiVersion: v1
kind: Service
metadata:
